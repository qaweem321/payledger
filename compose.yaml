# Local stack: SQL Server + the API. Start with `docker compose up -d --build`, then open http://localhost:5080/docs
name: payledger

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-CU9-GDR1-ubuntu-24.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=PayLedger;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Database__MigrateOnStartup: "true"
    ports:
      - "127.0.0.1:5080:8080"
    restart: unless-stopped

volumes:
  sqlserver-data:
